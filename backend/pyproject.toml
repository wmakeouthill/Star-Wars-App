[tool.poetry]
name = "holocron-analytics-backend"
version = "0.1.0"
description = "Holocron Analytics API"
authors = ["Holocron Team"]
packages = [{ include = "app", from = "src" }]

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.109.0"
uvicorn = { extras = ["standard"], version = "^0.27.0" }
pydantic = "^2.6.0"
pydantic-settings = "^2.1.0"
httpx = "^0.27.0"
cachetools = "^5.3.0"
openai = "^1.59.0"
sqlalchemy = "^2.0.36"
psycopg2-binary = "^2.9.10"
alembic = "^1.14.0"
pyjwt = "^2.10.1"
cryptography = "^44.0.0"
google-auth = "^2.38.0"
python-Levenshtein = "^0.26.0"
rapidfuzz = "^3.10.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pytest-asyncio = "^0.23.0"
pytest-cov = "^4.0.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
